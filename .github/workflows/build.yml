name: Build MinePanel

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minepanel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Node for existing frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build, test, and package with the Gradle wrapper
        run: ./gradlew --no-daemon --stacktrace --console=plain releaseBuild

      - name: Name JAR after the commit
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p build/ci-jar
          cp "build/release/minepanel-$version.jar" "build/ci-jar/MinePanel-$version-${GITHUB_SHA::7}.jar"

      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MinePanel-${{ github.sha }}
          path: build/ci-jar/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14
