minecraft_range=[1.21.1,1.21.2)
java_version=21
# The NeoForge MinePanel is compiled against, and the minimum it requires (ATM10 To the Sky runs 21.1.221).
neoforge_version=21.1.221

# Mixins whose targets only exist on newer versions.
excluded_mixins=ItemLayerRenderStateAccessor,ItemRenderStateAccessor

# Optional integrations: compiled against, never bundled. Sophisticated pins match ATM10 To the Sky.
sophisticated_backpacks_version=1.21.1-3.25.34.1604
sophisticated_core_version=1.21.1-1.4.11.1559
# The oldest Sophisticated Backpacks the integration accepts (its mods.toml version, without the build number).
sophisticatedbackpacks_minimum=3.25.34
# Forgematica/MaFgLib: the NeoForge ports of Litematica/MaLiLib (same fi.dy.masa packages).
forgematica_version=0.4.3+mc1.21.1
mafglib_version=0.4.3+mc1.21.1
# Curios: accessory slots (backpacks worn on the back, rings, ...). Matches ATM10 To the Sky.
curios_version=9.5.1+1.21.1
