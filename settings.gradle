pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    // Applies fabric-loom (26.1+, unobfuscated) or fabric-loom-remap (older, obfuscated) per version.
    id 'dev.kikugie.loom-back-compat' version '0.4.2'
    // Downloads the JDK a version needs (21 for 1.21.1, 25 for 26.1) when it isn't installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// One source tree, one JAR per Minecraft version and loader (versions/<minecraft>-<loader>/). Version- and
// loader-specific code uses //? comments; see docs/ARCHITECTURE.md. Fabric nodes run build.gradle, NeoForge ones
// build.neoforge.gradle.
stonecutter {
    create(rootProject) {
        version '1.21.1-fabric', '1.21.1'
        version '26.1.2-fabric', '26.1.2'
        version('1.21.1-neoforge', '1.21.1').buildscript('build.neoforge.gradle')
        vcsVersion = '26.1.2-fabric'
    }
}

rootProject.name = 'minepanel'
