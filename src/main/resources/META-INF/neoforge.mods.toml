modLoader="javafml"
loaderVersion="[4,)"
# No license has been chosen for MinePanel yet.
license="All Rights Reserved"

[[mods]]
modId="minepanel"
version="${version}"
displayName="MinePanel"
description='''A client-side Minecraft companion dashboard served locally.'''

[[mixins]]
config="minepanel.client.mixins.json"

# Only applied when AE2 is installed (its plugin checks); every target is an AE2 class.
[[mixins]]
config="minepanel.ae2.mixins.json"

[[dependencies.minepanel]]
modId="neoforge"
type="required"
versionRange="[${neoforge},)"
ordering="NONE"
side="CLIENT"

[[dependencies.minepanel]]
modId="minecraft"
type="required"
versionRange="${minecraft}"
ordering="NONE"
side="CLIENT"

# Optional integrations. Any version may load; MinePanel checks the minimums below itself and only turns the matching
# panel feature off, instead of NeoForge refusing to start the game over an older optional mod.
[[dependencies.minepanel]]
modId="litematica"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.minepanel]]
modId="sophisticatedbackpacks"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.minepanel]]
modId="sophisticatedstorage"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.minepanel]]
modId="curios"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.minepanel]]
modId="ae2"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.minepanel]]
modId="enderstorage"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[modproperties.minepanel]
litematica_minimum="${litematica_minimum}"
sophisticatedbackpacks_minimum="${sophisticatedbackpacks_minimum}"
