// Fabric: Stonecutter runs this script once per Fabric node (versions/<minecraft>-fabric/), against the shared src/.
plugins {
    id 'dev.kikugie.loom-back-compat'
}

def minecraftVersion = stonecutter.current.version
def javaVersion = project.java_version as int

version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group

base {
    archivesName = 'minepanel-fabric'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        minepanel {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Litematica and MaLiLib (LGPL-3.0): compile-time only, never bundled.
    exclusiveContent {
        forRepository {
            maven { url = 'https://masa.dy.fi/maven/sakura-ryoko' }
        }
        filter {
            includeGroup 'fi.dy.masa.litematica'
            includeGroup 'fi.dy.masa.malilib'
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // Mojang names on obfuscated versions; a no-op on 26.1+. mod* configurations remap there and are plain aliases on 26.1+.
    loomx.applyMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly("${project.litematica_dependency}:${project.litematica_version}") {
        transitive = false
    }
    modCompileOnly("${project.malilib_dependency}:${project.malilib_version}") {
        transitive = false
    }
}

processResources {
    exclude 'META-INF/neoforge.mods.toml'
    def expansions = [version: project.version.toString(), litematica_version: project.litematica_version,
                      minecraft: project.minecraft_range, java: javaVersion,
                      fabric_api: project.fabric_api_version.tokenize('+')[0]]
    inputs.properties expansions
    filesMatching('fabric.mod.json') {
        expand expansions
    }
}

processClientResources {
    // Mixins whose target classes don't exist on this Minecraft version (their sources are //? if'd out too).
    def excludedMixins = project.findProperty('excluded_mixins')?.toString()?.tokenize(',') ?: []
    inputs.property 'java', javaVersion
    inputs.property 'excludedMixins', excludedMixins
    filesMatching('minepanel.client.mixins.json') {
        expand java: javaVersion
        // Each mixin is on its own line, and none of these is the last entry, so the JSON stays valid.
        filter { line -> excludedMixins.any { line.trim() == '"' + it + '",' } ? null : line }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withSourcesJar()
}

tasks.jar {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
}

ext.modJar = loomx.modJar
ext.loaderMetadata = 'fabric.mod.json'
def litematicaRange = ">=${project.litematica_version}"
ext.checkMetadata = { java.util.jar.JarFile jar ->
    if (jar.getEntry('dev/craftyplayz/minepanel/litematica/LitematicaBuildSource.class') == null) {
        throw new GradleException('Release JAR is missing the Litematica adapter')
    }
    def metadata = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getEntry('fabric.mod.json')))
    if (metadata.suggests?.litematica != litematicaRange) {
        throw new GradleException("fabric.mod.json must suggest litematica ${litematicaRange}")
    }
}
apply from: rootProject.file('gradle/shared.gradle')
